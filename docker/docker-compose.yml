services:
  planning-poker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${IMAGE:-planning-poker}:${TAG:-latest}
    # Keep the application private behind the host Nginx reverse proxy.
    # Set DOCKER_BIND_ADDRESS explicitly if direct external access is required.
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    environment:
      PLANNING_POKER_HTTP_HOST: "0.0.0.0"
      PLANNING_POKER_HTTP_PORT: "8080"
      PLANNING_POKER_ROOMS_MAX_CONCURRENT: ${ROOMS_MAX_CONCURRENT:-100}
      PLANNING_POKER_ROOMS_MAX_ROLES: ${ROOMS_MAX_ROLES:-10}
      PLANNING_POKER_ROOMS_MAX_STORY_POINTS: ${ROOMS_MAX_STORY_POINTS:-10}
      PLANNING_POKER_ROOMS_MAX_PARTICIPANTS: ${ROOMS_MAX_PARTICIPANTS:-32}
      PLANNING_POKER_ROOMS_PENDING_TTL: ${ROOMS_PENDING_TTL:-10m}
      PLANNING_POKER_WEBSOCKET_PING_INTERVAL: ${WEBSOCKET_PING_INTERVAL:-1s}
      PLANNING_POKER_WEBSOCKET_MAX_MESSAGE_BYTES: ${WEBSOCKET_MAX_MESSAGE_BYTES:-32768}
      PLANNING_POKER_WEBSOCKET_MAX_CONNECTIONS: ${WEBSOCKET_MAX_CONNECTIONS:-1000}
      PLANNING_POKER_WEBSOCKET_JOIN_TIMEOUT: ${WEBSOCKET_JOIN_TIMEOUT:-10s}
      PLANNING_POKER_WEBSOCKET_MESSAGE_RATE_PER_SECOND: ${WEBSOCKET_MESSAGE_RATE_PER_SECOND:-20}
      PLANNING_POKER_WEBSOCKET_MESSAGE_BURST: ${WEBSOCKET_MESSAGE_BURST:-40}
      PLANNING_POKER_WEBSOCKET_OUTBOUND_QUEUE_SIZE: ${WEBSOCKET_OUTBOUND_QUEUE_SIZE:-32}
      PLANNING_POKER_WEBSOCKET_WRITE_TIMEOUT: ${WEBSOCKET_WRITE_TIMEOUT:-5s}
      PLANNING_POKER_HTTP_CREATE_RATE_PER_MINUTE: ${HTTP_CREATE_RATE_PER_MINUTE:-10}
      PLANNING_POKER_CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
